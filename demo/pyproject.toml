[project]
name = "cv-nlp-demo"
version = "0.1.0"
description = "Waste sorting demo combining YOLO vision and an Ollama-based NLP/RAG chatbot."
requires-python = ">=3.10"
dependencies = [
    "pynput>=1.7",
    "ultralytics>=8.0",
    "ollama>=0.3",
    "faiss-cpu>=1.7",
    "numpy>=1.24",
    "sentence-transformers>=2.2",
    "opencv-python>=4.5",
    "pypdf>=3.0",
]
