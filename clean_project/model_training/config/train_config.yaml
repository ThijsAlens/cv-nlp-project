# ============================================================
# Training configuration for the waste material detector.
# Edit this file to change dataset, model, and training settings.
# Then run: uv run python scripts/run_train.py
# ============================================================

# --- Dataset ---
dataset:
  # Path to the dataset root folder. Can be absolute or relative to the project root.
  path: ./data/Totaal_dataset
  # Filename of the source dataset YAML inside the dataset path.
  yaml: data.yaml
  # Expected class names. Used only for validation against the dataset YAML.
  # Training always uses the full class list found in the dataset.
  classes:
    - Cardboard
    - Glass
    - Metal
    - Paper
    - Plastic

# --- Model ---
model:
  # Pretrained YOLO weights to start from.
  # Use a model name (e.g. 'yolov8n.pt', 'yolov8s.pt') to download from Ultralytics,
  # or an absolute path to a local checkpoint.
  pretrained_weights: yolov8n.pt
  # Name for this training run. Used as the output subfolder name inside 'output_dir'.
  run_name: yolov8n_garbage_v1
  # Directory where training run folders are saved.
  output_dir: ./runs/train

# --- Training hyperparameters ---
training:
  epochs: 4  # <--- CHANGE THIS TO 100 FOR FULL TRAINING!!!
  imgsz: 640
  batch: 32
  # Device to train on: '0' for first GPU, 'cpu' for CPU, '0,1' for multi-GPU.
  device: "0"
  workers: 4
  # Number of backbone layers to freeze at the start of training.
  freeze: 10
  # Early stopping: stop if no improvement for this many epochs.
  patience: 20
  # Automatic mixed precision (speeds up training on modern GPUs).
  amp: true
  # Cache images in RAM ('ram') or on disk ('disk'). Set to false to disable.
  cache: false
  # Class balancing settings for imbalanced datasets.
  # Set 'balanced_training' to true to apply inverse-frequency class weights.
  balanced_training: false
  # Strength of the inverse-frequency weighting (0.0 = none, 1.0 = full).
  balanced_cls_pw: 0.25

# --- Post-training evaluation ---
evaluation:
  # Run evaluation on the listed splits immediately after training finishes.
  run_after_training: true
  splits:
    - val
    - test
  batch: 8

# --- Export options ---
export:
  # Export the best checkpoint to ONNX format after training.
  onnx: false
