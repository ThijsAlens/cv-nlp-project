# ============================================================
# Training configuration for the waste material detector.
# Edit this file to change dataset, model, and training settings.
# Then run: uv run python scripts/run_train.py
# ============================================================

# --- Dataset ---
dataset:
  # Path to the dataset root folder. Can be absolute or relative to the project root.
  # Points at the class-merged variant produced by 'scripts/run_merge_classes.py'.
  # To train on the unmerged 5-class dataset, set this back to './data/Totaal_dataset'
  # (or './data/all_data') and restore the 5 entries under 'classes' below.
  path: ./data/Totaal_dataset_merged
  # Filename of the source dataset YAML inside the dataset path.
  yaml: data.yaml
  # Expected class names. Used only for validation against the dataset YAML.
  # Training always uses the full class list found in the dataset.
  # These must match the merge spec at the top of 'scripts/run_merge_classes.py'.
  classes:
    - Glass
    - Metal
    - Plastic
    - Paper

# --- Model ---
model:
  # Pretrained YOLO weights to start from.
  # Use a model name (e.g. 'yolov8n.pt', 'yolov8s.pt') to download from Ultralytics,
  # or an absolute path to a local checkpoint.
  pretrained_weights: yolov8n.pt
  # Name for this training run. Used as the output subfolder name inside 'output_dir'.
  run_name: yolov8n_garbage_v4
  # Directory where training run folders are saved.
  output_dir: ./runs/train

# --- Training hyperparameters ---
training:
  epochs: 80
  imgsz: 640
  batch: -1
  # Device to train on: '0' for first GPU, 'cpu' for CPU, '0,1' for multi-GPU.
  device: "0"
  workers: 4
  # Number of backbone layers to freeze at the start of training.
  freeze: 5
  # Early stopping: stop if no improvement for this many epochs.
  patience: 20
  # Automatic mixed precision (speeds up training on modern GPUs).
  amp: true
  # Cache images in RAM ('ram') or on disk ('disk'). Set to false to disable.
  cache: false
  # Class balancing settings for imbalanced datasets.
  # Set 'balanced_training' to true to apply inverse-frequency class weights.
  balanced_training: true
  # Strength of the inverse-frequency weighting (0.0 = none, 1.0 = full).
  balanced_cls_pw: 0.5
  # Resume training from a checkpoint instead of starting fresh.
  # Set to false to start a new run, or a path (relative to the project root or absolute)
  # to a 'last.pt' file. Ultralytics restores the saved epoch and all training args.
  # Example: ./runs/train/yolov8n_garbage_v2-1/weights/last.pt
  resume: false

# --- Optimizer ---
optimizer:
  # Optimizer name: 'auto' lets Ultralytics pick, or use 'SGD', 'Adam', 'AdamW', 'RMSProp'.
  name: SGD
  # Use a cosine learning-rate schedule (lr decays smoothly toward zero over training).
  cos_lr: true

# --- Augmentation ---
# Probabilities and ranges applied to images during training.
augmentation:
  # Vary image size per batch (False = fixed at 'training.imgsz').
  multi_scale: false
  # Turn mosaic OFF for the last N epochs (helps final convergence on real images).
  close_mosaic: 20
  # Max random rotation in degrees.
  degrees: 10.0
  # Max random translation as a fraction of imgsz.
  translate: 0.1
  # Max random scale variation (zoom in/out).
  scale: 0.5
  # Probability of horizontal flip.
  fliplr: 0.5
  # Probability of mosaic augmentation (stitches 4 images together).
  mosaic: 1.0
  # Probability of mixup augmentation (blends two images).
  mixup: 0.1
  # Probability of copy-paste augmentation (pastes objects between images).
  copy_paste: 0.1
  # HSV hue jitter (kept small to preserve material colors).
  hsv_h: 0.015
  # HSV saturation jitter.
  hsv_s: 0.5
  # HSV value (brightness) jitter.
  hsv_v: 0.4

# --- Logging ---
logging:
  # Generate training plots (loss curves, PR curves, confusion matrix).
  plots: true
  # Run validation each epoch.
  val: true
  # Verbose training output.
  verbose: true

# --- Post-training evaluation ---
evaluation:
  # Run evaluation on the listed splits immediately after training finishes.
  run_after_training: true
  splits:
    - val
    - test
  batch: 8
  # Also compute precision/recall/F1 from the confusion matrix with the
  # 'background' row/column removed. These no-background metrics answer
  # 'given a detection, was the class correct?' without penalising missed
  # detections (FN-as-background) or false alarms (FP-as-background).
  # The standard mAP/precision/recall metrics are still computed regardless.
  exclude_background: true

# --- Export options ---
export:
  # Export the best checkpoint to ONNX format after training.
  onnx: true
