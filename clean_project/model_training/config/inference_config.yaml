# ============================================================
# Inference configuration for the waste detector.
# Used by both run_predict.py and run_crop_showcase.py.
# Edit 'weights' and 'target_image' before running.
# ============================================================

# Path to the trained model checkpoint (best.pt from a training run).
weights: ./runs/train/yolo11s_garbage_v1/weights/best.pt

# Path to bin_mapping.json (maps detected material names to disposal bins).
bin_mapping: ./config/bin_mapping.json

# Path to the dataset YAML (used to validate that class names match the model).
dataset_yaml: ./data/Totaal_dataset/data.yaml

# Path to the image to run inference on.
target_image: ./data/example.jpg

# Minimum confidence score for a detection to be included.
conf: 0.25

# Image size for inference (should match training imgsz).
imgsz: 640

# Device to use: '0' for first GPU, 'cpu' for CPU.
device: "0"

# Fraction of the bounding box size to add as padding around each crop.
margin_frac: 0.05

# Use clean production-style labels in the crop grid (true), or show
# debug info like confidence scores and material names (false).
pretty_images: true

# Directory where inference output folders (crop grids, JSON) are saved.
output_dir: ./runs/inference
