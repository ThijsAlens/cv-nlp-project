# ============================================================
# Smart Waste Sorter demo configuration.
# Edit this file to change the model, LLM, and paths.
# Then run: uv run python demo.py
# ============================================================

# --- Vision model ---
vision:
  # Name of the model bundle folder inside 'models/'.
  # The folder must contain a 'weights/best.pt' file.
  # Example: if the bundle is at 'models/yolov8n_garbage_v1/', set this to 'yolov8n_garbage_v1'.
  model_bundle: yolov8n_garbage_v4-2_finetune_real
  # OpenCV camera index passed to cv2.VideoCapture.
  # 0 = USB camera, 1 = internal laptop webcam.
  camera_index: 0
  # Rolling prediction window. When on, the class shown for each box is the
  # most common one over the last 'rolling_window_size' frames, and the
  # confidence is averaged across those frames. The box position itself is not
  # smoothed, it always comes from the current frame.
  # Set 'use_rolling_window' to false to just show the raw per-frame YOLO output.
  use_rolling_window: true
  rolling_window_size: 20
  # Maximum allowed bounding box size, as a fraction of the frame side.
  # A detection is dropped when both its width and its height go above this
  # fraction of the 640x640 frame. With 0.8, any box bigger than 512x512 is
  # ignored. This filters out the occasional full-frame 'phantom' predictions
  # YOLO makes when nothing is in front of the camera (like labelling an empty
  # desk as 'cardboard').
  # Set to 1.0 to turn the filter off.
  max_bbox_size: 0.8

# --- NLP / chatbot ---
nlp:
  # Ollama model name. The model must be pulled before running: 'ollama pull <name>'.
  model: qwen2.5:3b
  # Sentence-transformer model used to embed documents and queries for FAISS.
  embedding_model: all-MiniLM-L6-v2
  # Number of general-rule chunks returned by FAISS per query.
  faiss_top_k: 3
  # Number of region-specific documents returned by BM25 per query.
  bm25_top_k: 1
  # Print retrieved RAG chunks and the extracted location to the console.
  debug: false

# --- Optional graphical user interface ---
# When 'enabled' is true, the demo opens a window with the live annotated
# webcam feed on the left and the chatbot conversation on the right.
# When false, the annotated feed is written to 'temp/output.png' and the chat
# runs in the terminal.
gui:
  enabled: true
  # Refresh rate for the GUI's live feed, in milliseconds. Lower is smoother but
  # uses more CPU. The vision thread itself runs as fast as YOLO allows, this
  # only controls how often the GUI re-reads 'temp/output.png'.
  refresh_ms: 100

# --- File paths (relative to the project root) ---
paths:
  # Shared directory for temporary files written by the vision thread
  # and read by the NLP thread (input.png, output.png, results.json).
  temp_dir: ./temp
  # NLP document directories.
  general_docs: ./nlp/documents/general
  region_docs: ./nlp/documents/regions
  faiss_index: ./nlp/faiss_index
  # NLP data files.
  sorting_rules: ./nlp/sorting_rules.json
  system_prompt: ./nlp/system_prompt.txt
  start_prompt: ./nlp/start_conversation.txt
