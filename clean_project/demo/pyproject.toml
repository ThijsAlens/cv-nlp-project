[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waste-sorter-demo"
version = "1.0.0"
description = "Smart Waste Sorter demo: webcam YOLO detection + RAG-backed disposal chatbot."
requires-python = ">=3.10"
dependencies = [
    # YOLO object detection.
    "ultralytics>=8.4",
    # Webcam capture and image processing.
    "opencv-python>=4.5",
    # ESC key listener to stop the demo gracefully.
    "pynput>=1.7",
    # Local LLM client (Ollama must be running separately).
    "ollama>=0.6",
    # Vector similarity search for FAISS retrieval.
    "faiss-cpu>=1.7",
    # Sentence embedding model for FAISS index construction and querying.
    "sentence-transformers>=2.2",
    # BM25 keyword search for region-specific rule retrieval.
    "rank-bm25>=0.2.2",
    # Numerical operations used by FAISS and embeddings.
    "numpy>=1.26",
    # YAML config file parsing.
    "pyyaml>=6.0",
    # PyTorch is required by ultralytics and sentence-transformers.
    "torch>=2.0",
]
