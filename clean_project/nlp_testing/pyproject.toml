[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-assistant"
version = "1.0.0"
description = "RAG-backed waste disposal chatbot using FAISS, BM25, and a local Ollama LLM."
requires-python = ">=3.11,<3.13"
dependencies = [
    # Local LLM client (Ollama must be running separately).
    "ollama>=0.6.2",
    # Vector similarity search for FAISS retrieval.
    "faiss-cpu>=1.7",
    # Sentence embedding model for FAISS index construction and querying.
    "sentence-transformers>=2.2",
    # BM25 keyword search for region-specific rule retrieval.
    "rank-bm25>=0.2.2",
    # Numerical operations used by FAISS and embeddings.
    "numpy>=1.26",
    # YAML config file parsing.
    "pyyaml>=6.0",
    # PyTorch is required by sentence-transformers.
    "torch>=2.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
